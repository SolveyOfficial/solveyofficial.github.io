name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Upload site
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
